name: Broadcast branch checks

on:
  push:
    branches:
      - feature/broadcast-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax-and-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Import bot handlers without running Telegram bot
        env:
          BOT_TOKEN: '123456:TEST_TOKEN'
          ADMIN_ID: '12345'
        run: |
          python - <<'PY'
          from handlers import admin, user
          assert admin.router is not None
          assert user.router is not None
          assert hasattr(admin, "broadcast_command")
          assert hasattr(admin, "send_broadcast_copy")
          assert hasattr(user, "broadcast_unsubscribe")
          from unittest.mock import patch
          with patch.dict("os.environ", {}, clear=True):
              assert admin.broadcast_live_enabled() is False
          with patch.dict("os.environ", {"BROADCAST_LIVE_ENABLED": "false"}):
              assert admin.broadcast_live_enabled() is False
          with patch.dict("os.environ", {"BROADCAST_LIVE_ENABLED": "true"}):
              assert admin.broadcast_live_enabled() is True
          assert admin.broadcast_recipient_ids(12345, [1, 2, 3], False) == [12345]
          assert admin.broadcast_recipient_ids(12345, [12345, 1, 2], True) == [1, 2]
          print("Handler imports and broadcast entry points OK")
          PY
